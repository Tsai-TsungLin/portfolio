# relexes.com 根網域改給個人網站後的 80 埠區塊（Cloudflare 打 origin 80；443 由 certbot 管理，不要手動覆蓋）。
# 這份只是預覽，還沒安裝到 VM。實際切換步驟見 ../README.md「網域整理」。
# 保留的路徑：/tools/（excel-tools）、/line/ 與 /google/callback（hermes）——使用者指定不搬。
# 搬走的路徑：/ 與 /nba/ /mlb/ /kbo/（scanNBA → 子網域）、/trader/ 與 /ws（taiex-trader → trader.relexes.com）。
server {
    listen 80;
    server_name relexes.com www.relexes.com;

    # excel-tools（不搬）
    location /tools/excel/inspect {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }
    location /tools/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # 沙發提案靜態頁（不搬）
    location /proposal {
        alias /var/www/proposal;
        index index.html;
        try_files $uri $uri/ /proposal/index.html;
    }

    # hermes LINE webhook 與 Google OAuth callback（不搬，改網址要動 LINE 與 Google 後台）
    location /line/ {
        proxy_pass http://127.0.0.1:8646;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /google/callback {
        proxy_pass http://127.0.0.1:8647;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 個人網站（新）：其餘全部交給 portfolio，/health 也由它回
    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
